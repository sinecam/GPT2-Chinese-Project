<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>V4.7 中文助手</title>
  <style>
    :root {
      --page: #f4f6f8;
      --surface: #ffffff;
      --ink: #17202a;
      --muted: #687482;
      --line: #dce2e8;
      --accent: #087f73;
      --accent-hover: #06675f;
      --user: #e8f1ff;
      --assistant: #edf7f2;
      --danger: #b42318;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 320px;
      background: var(--page);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
        "Microsoft YaHei", sans-serif;
      letter-spacing: 0;
    }

    button, textarea { font: inherit; }

    .app {
      display: grid;
      grid-template-columns: 300px minmax(0, 1fr);
      min-height: 100vh;
    }

    .sidebar {
      padding: 22px 18px;
      background: var(--surface);
      border-right: 1px solid var(--line);
      overflow-y: auto;
    }

    .brand { margin-bottom: 24px; }

    .brand h1 {
      margin: 0;
      font-size: 22px;
      line-height: 1.3;
    }

    .brand p {
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .sidebar h2 {
      margin: 0 0 10px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .prompts {
      display: grid;
      gap: 8px;
    }

    .prompt-button, .clear-button {
      width: 100%;
      min-height: 42px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
      color: var(--ink);
      padding: 9px 11px;
      cursor: pointer;
      text-align: left;
    }

    .prompt-button:hover, .clear-button:hover { border-color: var(--accent); }

    .prompt-button:disabled, .clear-button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .clear-button {
      margin-top: 18px;
      color: var(--muted);
      text-align: center;
    }

    .workspace {
      display: grid;
      grid-template-rows: auto minmax(0, 1fr) auto;
      min-height: 100vh;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 66px;
      padding: 14px 22px;
      background: var(--surface);
      border-bottom: 1px solid var(--line);
    }

    .topbar strong { font-size: 16px; }

    .status {
      color: var(--muted);
      font-size: 13px;
    }

    .status.ready { color: var(--accent); }

    .chat {
      display: flex;
      flex-direction: column;
      gap: 12px;
      overflow-y: auto;
      padding: 22px;
    }

    .bubble {
      width: fit-content;
      max-width: min(820px, 86%);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px 14px;
      line-height: 1.7;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .bubble.user {
      align-self: flex-end;
      background: var(--user);
    }

    .bubble.assistant {
      align-self: flex-start;
      background: var(--assistant);
    }

    .composer-wrap {
      padding: 14px 22px 18px;
      background: var(--surface);
      border-top: 1px solid var(--line);
    }

    .composer {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 96px;
      gap: 10px;
      max-width: 1000px;
      margin: 0 auto;
    }

    .composer textarea {
      width: 100%;
      min-height: 54px;
      max-height: 160px;
      resize: vertical;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 12px;
      color: var(--ink);
      background: var(--surface);
      line-height: 1.5;
      outline: none;
    }

    .composer textarea:focus { border-color: var(--accent); }

    .send-button {
      border: 0;
      border-radius: 8px;
      background: var(--accent);
      color: #ffffff;
      cursor: pointer;
      font-weight: 700;
    }

    .send-button:hover { background: var(--accent-hover); }

    .send-button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .error {
      max-width: 1000px;
      min-height: 18px;
      margin: 7px auto 0;
      color: var(--danger);
      font-size: 13px;
    }

    @media (max-width: 820px) {
      .app { grid-template-columns: 1fr; }
      .sidebar {
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }
      .prompts { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .workspace { min-height: 72vh; }
    }

    @media (max-width: 520px) {
      .prompts { grid-template-columns: 1fr; }
      .topbar {
        align-items: flex-start;
        gap: 8px;
        flex-direction: column;
      }
      .composer { grid-template-columns: 1fr; }
      .send-button { height: 44px; }
      .bubble { max-width: 94%; }
    }
  </style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <h1>V4.7 中文助手</h1>
        <p>124M 参数中文对话模型</p>
      </div>

      <h2>演示问题</h2>
      <div class="prompts">
        <button class="prompt-button" data-prompt="请用一句话介绍你自己，并说明你能提供哪些帮助。">自我介绍</button>
        <button class="prompt-button" data-prompt="请用一句话解释什么是大语言模型。">解释大语言模型</button>
        <button class="prompt-button" data-prompt="请用两句话说明规律运动的好处，不要列点。">规律运动的好处</button>
        <button class="prompt-button" data-prompt="写一封简短请假邮件，收件人是陈老师，因为感冒发烧请假一天。">请假邮件</button>
      </div>

      <button id="clear" class="clear-button" type="button">清空对话</button>
    </aside>

    <main class="workspace">
      <header class="topbar">
        <strong>中文对话演示</strong>
        <span id="status" class="status">正在加载模型</span>
      </header>

      <section id="chat" class="chat" aria-live="polite"></section>

      <div class="composer-wrap">
        <form id="composer" class="composer">
          <textarea id="message" aria-label="问题" placeholder="输入问题"></textarea>
          <button id="send" class="send-button" type="submit">发送</button>
        </form>
        <div id="error" class="error"></div>
      </div>
    </main>
  </div>

  <script>
    const history = [];
    const chat = document.getElementById("chat");
    const messageBox = document.getElementById("message");
    const sendButton = document.getElementById("send");
    const clearButton = document.getElementById("clear");
    const errorBox = document.getElementById("error");
    const promptButtons = [...document.querySelectorAll("[data-prompt]")];

    function setBusy(busy) {
      sendButton.disabled = busy;
      clearButton.disabled = busy;
      promptButtons.forEach((button) => button.disabled = busy);
      sendButton.textContent = busy ? "生成中" : "发送";
    }

    function addBubble(role, content) {
      const bubble = document.createElement("div");
      bubble.className = "bubble " + role;
      bubble.textContent = content;
      chat.appendChild(bubble);
      chat.scrollTop = chat.scrollHeight;
    }

    function clearConversation() {
      history.length = 0;
      chat.innerHTML = "";
      errorBox.textContent = "";
      messageBox.value = "";
    }

    async function sendMessage(rawMessage, resetHistory = false) {
      const message = rawMessage.trim();
      if (!message) return;

      if (resetHistory) clearConversation();
      errorBox.textContent = "";
      addBubble("user", message);
      messageBox.value = "";
      setBusy(true);

      try {
        const response = await fetch("/api/chat", {
          method: "POST",
          headers: {"Content-Type": "application/json"},
          body: JSON.stringify({message, history})
        });
        if (!response.ok) throw new Error(await response.text());

        const result = await response.json();
        const answer = result.answer || "没有生成内容。";
        addBubble("assistant", answer);
        history.push({role: "user", content: message});
        history.push({role: "assistant", content: result.answer || ""});
      } catch (error) {
        errorBox.textContent = String(error.message || error);
      } finally {
        setBusy(false);
        messageBox.focus();
      }
    }

    document.getElementById("composer").addEventListener("submit", (event) => {
      event.preventDefault();
      sendMessage(messageBox.value);
    });

    messageBox.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendMessage(messageBox.value);
      }
    });

    promptButtons.forEach((button) => {
      button.addEventListener("click", () => {
        messageBox.value = button.dataset.prompt;
        messageBox.focus();
      });
    });

    clearButton.addEventListener("click", clearConversation);

    async function loadStatus() {
      const status = document.getElementById("status");
      try {
        const response = await fetch("/api/status");
        if (!response.ok) throw new Error("status unavailable");
        const model = await response.json();
        status.textContent = "模型已就绪 · " + (model.parameters / 1e6).toFixed(2) + "M 参数";
        status.classList.add("ready");
      } catch (_) {
        status.textContent = "模型状态不可用";
      }
    }

    loadStatus();
  </script>
</body>
</html>
